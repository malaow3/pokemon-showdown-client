<!doctype html>
<html>
<head><meta charset="utf-8"><title>PokeBin Auth</title></head>
<body style="font: 14px system-ui; padding: 2rem; text-align: center;">
  <p>Connecting to PokeBin… You can close this window.</p>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      if (code && state && window.opener) {
        window.opener.postMessage({ type: 'pokebin-auth-callback', code, state }, location.origin);
      } else if (error && window.opener) {
        window.opener.postMessage({ type: 'pokebin-auth-callback', error }, location.origin);
      }
      setTimeout(function () { window.close(); }, 600);
    })();
  </script>
</body>
</html>
