	<script>
		(function () {
			var log = document.querySelector('#room-news .readable-bg');
			if (!log) return;
			var xhr = new XMLHttpRequest();
			xhr.open('GET', '/news.json');
			xhr.onload = function () {
				try {
					var data = JSON.parse(xhr.responseText);
					var html = '';
					for (var i = 0; i < 2 && i < data.length; i++) {
						var post = data[i];
						html += '<div class="newsentry" data-newsid="' + (post.id || '') + '">';
						if (post.title) html += '<h4>' + post.title + '</h4>';
						if (post.summaryHTML) html += '<p>' + post.summaryHTML + '</p>';
						html += '<p>';
						if (post.author) html += '&mdash;<strong>' + post.author + '</strong>';
						if (post.date) html += '<small class="date"> on ' + new Date(post.date * 1000).toDateString() + '</small>';
						html += '</p></div>';
					}
					var roomNews = document.getElementById('room-news');
					if (roomNews && data[0] && data[0].id) roomNews.setAttribute('data-newsid', data[0].id);
					log.innerHTML = html;
				} catch (e) {}
			};
			xhr.send();
		})();
	</script>
