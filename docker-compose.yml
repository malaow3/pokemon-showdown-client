services:
  web:
    build:
      context: .
      target: nginx
    image: ${DOCKER_IMAGE:-pokemon-showdown-client-nginx:latest}
    network_mode: host
    command: /bin/sh -c "sed -i 's/listen 80;/listen 4000;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: unless-stopped
