server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index caches/index-new.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# Local login proxy used by the beta and classic test clients.
	# Nginx forwards POST bodies and cookies to the upstream login server, then
	# rewrites returned cookies so they can be stored for this local/deployed host.
	location = /api/loginserver {
		proxy_pass https://play.pokemonshowdown.com/~~showdown/action.php;
		proxy_ssl_server_name on;
		proxy_http_version 1.1;

		proxy_set_header Host play.pokemonshowdown.com;
		proxy_set_header Cookie $http_cookie;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_cookie_domain play.pokemonshowdown.com $host;
		proxy_cookie_domain .pokemonshowdown.com $host;
		proxy_cookie_path / /;
		proxy_cookie_flags ~ secure samesite=lax;
	}

	location = / {
		try_files /caches/index-new.html =404;
		expires -1;
		add_header Cache-Control "no-cache";
	}

	location = /hellodex {
		try_files /caches/index-new.html =404;
		expires -1;
		add_header Cache-Control "no-cache";
	}

	location = /classic {
		try_files /testclient-old.html =404;
		expires -1;
		add_header Cache-Control "no-cache";
	}

	location = /classic/ {
		return 301 /classic;
	}

	# News fallback for builds without config/news.inc.php.
	location = /news.json {
		proxy_pass https://pokemonshowdown.com/news.json;
		proxy_ssl_server_name on;
		proxy_set_header Host pokemonshowdown.com;
	}

	# Runtime config is outside the static web root in this Docker image.
	location ^~ /config/ {
		proxy_pass https://play.pokemonshowdown.com$request_uri;
		proxy_ssl_server_name on;
		proxy_set_header Host play.pokemonshowdown.com;
	}

	# Upstream-style login endpoint used by caches/index-new.html.
	location ~ ^/~~([^/]+)/action\.php$ {
		proxy_pass https://play.pokemonshowdown.com$request_uri;
		proxy_ssl_server_name on;
		proxy_http_version 1.1;
		proxy_set_header Host play.pokemonshowdown.com;
		proxy_set_header Cookie $http_cookie;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cookie_domain play.pokemonshowdown.com $host;
		proxy_cookie_domain .pokemonshowdown.com $host;
		proxy_cookie_path / /;
		proxy_cookie_flags ~ secure samesite=lax;
	}

	# Some generated data/server files aren't present in this client-only image.
	# Match the old Deno dev server behavior by falling back to upstream.
	location ^~ /data/ {
		try_files $uri @play_upstream;
		access_log off;
		expires 30d;
		add_header Cache-Control "public";
	}

	location ^~ /js/server/ {
		try_files $uri @play_upstream;
		access_log off;
		expires 30d;
		add_header Cache-Control "public";
	}

	location = /js/battledata.js {
		try_files $uri @play_upstream;
		access_log off;
		expires 30d;
		add_header Cache-Control "public";
	}

	location @play_upstream {
		proxy_pass https://play.pokemonshowdown.com$request_uri;
		proxy_ssl_server_name on;
		proxy_set_header Host play.pokemonshowdown.com;
	}

	# Native Showdex assets bundled with the client. Keep this before the generic
	# SPA fallback so JSON/data files required by Showdex never fall through to HTML.
	location ^~ /showdex/ {
		try_files $uri =404;
		access_log off;
		expires 30d;
		add_header Cache-Control "public";
	}

	# Static assets; cache aggressively when URLs include cachebusters.
	location ~* \.(?:js|css|json|map|txt|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
		try_files $uri =404;
		access_log off;
		expires 30d;
		add_header Cache-Control "public";
	}

	# Keep HTML fresh so deployed fixes are picked up quickly.
	location ~* \.html$ {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-cache";
	}

	# SPA fallback serves HTML under arbitrary URIs, so it must not be cached.
	location / {
		try_files $uri $uri/ /caches/index-new.html;
		expires -1;
		add_header Cache-Control "no-cache";
	}
}
