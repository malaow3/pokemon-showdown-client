server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index testclient-beta.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# Local login proxy used by the beta and classic test clients.
	# Nginx forwards POST bodies and cookies to the upstream login server, then
	# rewrites returned cookies so they can be stored for this local/deployed host.
	location = /api/loginserver {
		proxy_pass https://play.pokemonshowdown.com/~~showdown/action.php;
		proxy_ssl_server_name on;
		proxy_http_version 1.1;

		proxy_set_header Host play.pokemonshowdown.com;
		proxy_set_header Cookie $http_cookie;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_cookie_domain play.pokemonshowdown.com $host;
		proxy_cookie_domain .pokemonshowdown.com $host;
		proxy_cookie_path / /;
		proxy_cookie_flags ~ secure samesite=lax;
	}

	location = / {
		try_files /testclient-beta.html =404;
	}

	location = /hellodex {
		try_files /testclient-beta.html =404;
	}

	location = /classic {
		try_files /testclient-old.html =404;
	}

	location = /classic/ {
		return 301 /classic;
	}

	# Static assets; cache aggressively when URLs include cachebusters.
	location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
		try_files $uri =404;
		access_log off;
		expires 30d;
		add_header Cache-Control "public";
	}

	# Keep HTML fresh so deployed fixes are picked up quickly.
	location ~* \.html$ {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-cache";
	}

	location / {
		try_files $uri $uri/ /testclient-beta.html;
	}
}
